name: Primary

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.14"
      - name: Install Python
        run: uv python install
      - name: Install Dependencies
        run: uv sync --locked --dev
      - name: Check Lockfile
        run: uv lock --check
      - name: Run Ruff Lint
        run: uv run ruff check --no-fix .
      - name: Run Ruff Format Check
        run: uv run ruff format --check .
      - name: Run ty
        run: uv run ty check
      - name: Run Tests
        run: >-
          uv run pytest
          --cov=core
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml
          --cov-report=html
          --cov-fail-under=0
      - name: Check Coverage Target
        continue-on-error: true
        run: uv run coverage report --fail-under=100
      - name: Upload Coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: warn

  publish:
    name: Publish
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Lowercase Repository Name
        id: repository
        run: |
          echo "name_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build and Push to GHCR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repository.outputs.name_lowercase }}:latest
            ghcr.io/${{ steps.repository.outputs.name_lowercase }}:${{ github.sha }}
