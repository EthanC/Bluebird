name: Primary

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
      - name: Install Python
        run: uv python install
      - name: Install Dependencies
        run: uv sync --locked --dev
      - name: Run Ruff Lint
        run: uv run ruff check --no-fix .
      - name: Run Ruff Format Check
        run: uv run ruff format --check .
      - name: Run ty
        run: uv run ty check

  publish:
    name: Publish
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Lowercase Repository Name
        id: repository
        run: |
          echo "name_lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Build and Push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repository.outputs.name_lowercase }}:latest
            ghcr.io/${{ steps.repository.outputs.name_lowercase }}:${{ github.sha }}
